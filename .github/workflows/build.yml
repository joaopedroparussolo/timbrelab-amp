name: Compilar plugin (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Reunir arquivos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem -Recurse build -Filter *.vst3 -Directory | ForEach-Object { Copy-Item $_.FullName -Destination dist -Recurse }
          Get-ChildItem -Recurse build -Filter *.exe | Where-Object { $_.FullName -like '*Standalone*' } | ForEach-Object { Copy-Item $_.FullName -Destination dist }

      - uses: actions/upload-artifact@v4
        with:
          name: TimbreLab-Amp-Windows
          path: dist
